baseURL = "https://go-crdt.github.io/"
title = "go-crdt"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "kind" says what layer it is; "type" says whether it is a
# library you import or a service you run. "result" is the honest headline —
# what is proven, and by what.
[[params.repos]]
  name = "crdt"
  what = "Doc, List, Map, Composite, structured documents, awareness"
  kind = "engine"
  type = "lib"
  proof = "a real 259 778-edit history replays in 18.4 ms and matches, character for character"
  result = "A replicated document: any number of replicas edit at once, offline, over an unreliable transport, and converge. Three merging structures — a text, a list, a map — under one name, one snapshot and one thing to authorise; and a layer of document types built on them that adds no merge rule of its own: blocks, formatting, spreadsheets, isometric diagrams, movable trees, counters, sets, handwriting, chunked files, undo, and changes put up for review. Characters are stored as runs — a thousand typed in a row cost one header and their text — and the document walks both ways, so editing stays local. Convergence is proven by exhaustive permutation, not sampling. Zero dependencies, CGO=0, 100% statement coverage, and the whole suite runs as WebAssembly under Node in CI."
[[params.repos]]
  name = "collab"
  what = "Collab gRPC service, Server, Client"
  kind = "transport"
  type = "lib"
  proof = "three replicas across two runtimes converge, in CI"
  result = "Carries a document between the people editing it: a per-document hub that fans out operations, welcomes late joiners with a snapshot, and keeps presence. The server arbitrates nothing — it applies what it is sent and passes it on — so a participant may edit while disconnected and the server may be restarted without anyone losing work. Documents persist to memory or PostgreSQL, and who may open which is decided per session. 100% coverage; the acceptance test runs two WebAssembly participants against a native one over a real WebSocket."

[params.brand]
