# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 8.72:1, bright on the dark background 4.10:1.
  base = "#6b21a8"
  deep = "#411466"
  bright = "#c026d3"
  shadow = "rgba(107,33,168,.7)"
  glow = "rgba(107,33,168,.6)"
  wash = "rgba(107,33,168,.10)"
  washDeep = "rgba(65,20,102,.06)"
  chipBg = "#f7e5fa"
  chipBorder = "#ecbef2"
  chipFg = "#411466"
  chipBgDark = "rgba(192,38,211,.14)"
  chipBorderDark = "rgba(192,38,211,.32)"
  chipFgDark = "#dc88e7"
  statsEnd = "#f0cbf4"
  bandText = "#f5dcf8"
